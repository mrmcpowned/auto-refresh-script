                - img "Black caracara" [ref=e376]
              - paragraph [ref=e377]:
                - text: The
                - link "black caracara" [ref=e379] [cursor=pointer]:
                  - /url: /wiki/Black_caracara
                - text: (Daptrius ater) is a
                - link "bird of prey" [ref=e380] [cursor=pointer]:
                  - /url: /wiki/Bird_of_prey
                - text: in the family
                - link "Falconidae" [ref=e381] [cursor=pointer]:
                  - /url: /wiki/Falconidae
                - text: ", found in the lowlands of the"
                - link "Amazon basin" [ref=e382] [cursor=pointer]:
                  - /url: /wiki/Amazon_basin
                - text: and
                - link "French Guiana" [ref=e383] [cursor=pointer]:
                  - /url: /wiki/French_Guiana
                - text: . Its common habitats include rivers,
                - link "gallery forest" [ref=e384] [cursor=pointer]:
                  - /url: /wiki/Gallery_forest
                - text: and wooded
                - link "savanna" [ref=e385] [cursor=pointer]:
                  - /url: /wiki/Savanna
                - text: ", at elevations up to 900 meters (3,000 ft). A largely"
                - link "sedentary" [ref=e386] [cursor=pointer]:
                  - /url: /wiki/Bird_migration
                - text: and sociable species, it is an opportunistic
                - link "omnivore" [ref=e387] [cursor=pointer]:
                  - /url: /wiki/Omnivore
                - text: ", its diet including"
                - link "carrion" [ref=e388] [cursor=pointer]:
                  - /url: /wiki/Carrion
                - text: ", small mammals and reptiles, fish, fruit, insects, and other bird species. It is also known for removing parasites from animals such as"
                - link "tapirs" [ref=e389] [cursor=pointer]:
                  - /url: /wiki/Tapir
                - text: and
                - link "capybaras" [ref=e390] [cursor=pointer]:
                  - /url: /wiki/Capybara
                - text: . Adults are mostly glossy black, with a white band on the tail, and bright yellow to orange-red feet and face. This black caracara was photographed on a branch near the
                - link "Napo River" [ref=e391] [cursor=pointer]:
                  - /url: /wiki/Napo_River
                - text: in
                - link "Sucumbíos Province" [ref=e392] [cursor=pointer]:
                  - /url: /wiki/Sucumb%C3%ADos_Province
                - text: ", northeastern Ecuador."
