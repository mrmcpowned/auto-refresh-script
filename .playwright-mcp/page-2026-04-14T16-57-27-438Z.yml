          - generic [ref=e434]:
            - heading "Today's featured picture" [level=2] [ref=e435]
            - generic [ref=e436]:
              - link "Black caracara" [ref=e438] [cursor=pointer]:
                - /url: /wiki/File:Black_caracara_(Daptrius_ater)_Rio_Napo.jpg
                - img "Black caracara" [ref=e439]
              - paragraph [ref=e440]:
                - text: The
                - link "black caracara" [ref=e442] [cursor=pointer]:
                  - /url: /wiki/Black_caracara
                - text: (Daptrius ater) is a
                - link "bird of prey" [ref=e443] [cursor=pointer]:
                  - /url: /wiki/Bird_of_prey
                - text: in the family
                - link "Falconidae" [ref=e444] [cursor=pointer]:
                  - /url: /wiki/Falconidae
                - text: ", found in the lowlands of the"
                - link "Amazon basin" [ref=e445] [cursor=pointer]:
                  - /url: /wiki/Amazon_basin
                - text: and
                - link "French Guiana" [ref=e446] [cursor=pointer]:
                  - /url: /wiki/French_Guiana
                - text: . Its common habitats include rivers,
                - link "gallery forest" [ref=e447] [cursor=pointer]:
                  - /url: /wiki/Gallery_forest
                - text: and wooded
                - link "savanna" [ref=e448] [cursor=pointer]:
                  - /url: /wiki/Savanna
                - text: ", at elevations up to 900 meters (3,000 ft). A largely"
                - link "sedentary" [ref=e449] [cursor=pointer]:
                  - /url: /wiki/Bird_migration
                - text: and sociable species, it is an opportunistic
                - link "omnivore" [ref=e450] [cursor=pointer]:
                  - /url: /wiki/Omnivore
                - text: ", its diet including"
                - link "carrion" [ref=e451] [cursor=pointer]:
                  - /url: /wiki/Carrion
                - text: ", small mammals and reptiles, fish, fruit, insects, and other bird species. It is also known for removing parasites from animals such as"
                - link "tapirs" [ref=e452] [cursor=pointer]:
                  - /url: /wiki/Tapir
                - text: and
                - link "capybaras" [ref=e453] [cursor=pointer]:
                  - /url: /wiki/Capybara
                - text: . Adults are mostly glossy black, with a white band on the tail, and bright yellow to orange-red feet and face. This black caracara was photographed on a branch near the
                - link "Napo River" [ref=e454] [cursor=pointer]:
                  - /url: /wiki/Napo_River
                - text: in
                - link "Sucumbíos Province" [ref=e455] [cursor=pointer]:
                  - /url: /wiki/Sucumb%C3%ADos_Province
                - text: ", northeastern Ecuador."
              - paragraph [ref=e456]:
