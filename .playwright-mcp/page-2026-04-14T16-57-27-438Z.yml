                - paragraph [ref=e172]:
                  - link "Flow" [ref=e175] [cursor=pointer]:
                    - /url: /wiki/Flow_(video_game)
                  - text: is a
                  - link "video game" [ref=e176] [cursor=pointer]:
                    - /url: /wiki/Video_game
                  - text: created by
                  - link "Jenova Chen" [ref=e177] [cursor=pointer]:
                    - /url: /wiki/Jenova_Chen
                  - text: (pictured) and Nicholas Clark. Released as a
                  - link "Flash game" [ref=e178] [cursor=pointer]:
                    - /url: /wiki/Browser_game
                  - text: in 2006 to accompany Chen's
                  - link "master's" [ref=e179] [cursor=pointer]:
                    - /url: /wiki/Master%27s_degree
                  - text: thesis, it was reworked into a
                  - link "PlayStation 3" [ref=e180] [cursor=pointer]:
                    - /url: /wiki/PlayStation_3
                  - text: game by
                  - link "Thatgamecompany" [ref=e181] [cursor=pointer]:
                    - /url: /wiki/Thatgamecompany
                  - text: ", with assistance from"
                  - link "Santa Monica Studio" [ref=e182] [cursor=pointer]:
                    - /url: /wiki/Santa_Monica_Studio
                  - text: . In Flow, the player navigates a series of
                  - link "two-dimensional" [ref=e183] [cursor=pointer]:
                    - /url: /wiki/2D_computer_graphics
                  - text: planes with an aquatic
                  - link "microorganism" [ref=e184] [cursor=pointer]:
                    - /url: /wiki/Microorganism
                  - text: that evolves by consuming other microorganisms. The game's design is based on Chen's research into
                  - link "dynamic difficulty adjustment" [ref=e185] [cursor=pointer]:
                    - /url: /wiki/Dynamic_game_difficulty_balancing
                  - text: and on
                  - link "Mihaly Csikszentmihalyi" [ref=e186] [cursor=pointer]:
                    - /url: /wiki/Mihaly_Csikszentmihalyi
                  - text: "'s theoretical concept of"
                  - link "flow" [ref=e187] [cursor=pointer]:
                    - /url: /wiki/Flow_(psychology)
                  - text: . The Flash version of the game was downloaded 100,000 times within its first two weeks of release, and had been played more than 3.5 million times by 2008. Its PlayStation 3 re-release was the most downloaded game on the
                  - link "PlayStation Network" [ref=e188] [cursor=pointer]:
                    - /url: /wiki/PlayStation_Network
                  - text: in 2007 and won the Best Downloadable Game award at the 2008
                  - link "Game Developers Choice Awards" [ref=e189] [cursor=pointer]:
                    - /url: /wiki/Game_Developers_Choice_Awards
                  - text: . Reviewers praised Flow's visual and audio appeal, but noted the simplicity of its gameplay; several considered it to be more of an art piece than a game.
